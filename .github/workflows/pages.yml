name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - 'LICENSE'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'p/**'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'robots.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # 纯静态、零构建：只把站点文件放进 _site，排除 .git / .github / tools / *.md 等无关文件
      - name: Stage static site
        run: |
          mkdir -p _site
          for item in index.html 404.html .nojekyll sitemap.xml feed.xml robots.txt LICENSE css data js p; do
            if [ -e "$item" ]; then cp -a "$item" _site/; fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

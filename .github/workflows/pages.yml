name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - 'LICENSE'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'img/**'
      - 'p/**'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'robots.txt'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # P1-8：四件套门禁并入 Pages 的 build job——任一失败则 build 失败，
      # 下游 deploy（needs: build）不会执行。与 ci.yml 同版本（checkout@v4 / setup-node@v4 / Node 20）。
      - name: 门禁 · 数据校验
        run: node tools/validate.js
      - name: 门禁 · 统计口径
        run: node tools/stats.js --check
      - name: 门禁 · 渲染回归
        run: node tools/smoke-test.js
      - name: 门禁 · 静态托管审计
        run: node tools/static-audit.js

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # 纯静态、零构建：只把站点文件放进 _site，排除 .git / .github / tools / *.md 等无关文件
      - name: Stage static site
        run: |
          mkdir -p _site
          for item in index.html 404.html .nojekyll sitemap.xml feed.xml robots.txt LICENSE css data js img p; do
            if [ -e "$item" ]; then cp -a "$item" _site/; fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

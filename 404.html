<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在 —— 日理万机</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b1020; color: #e8ecf6; text-align: center; }
    a { color: #5b8cff; }
    .box { padding: 40px 24px; }
    .big { font-size: 56px; line-height: 1; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: #9aa7bd; margin: 0 0 22px; }
    .btn { display: inline-block; padding: 10px 22px; border-radius: 12px;
      /* 问题 39：白字承载面换深端渐变（对白字 ≥4.5:1），原 #5b8cff→#22d3ee 仅 3.16:1/1.81:1 */
      background: linear-gradient(120deg, #2f5fd0 0%, #0e7490 100%); color: #fff;
      text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <!-- 问题 65：内容包进 <main> 地标；问题 78：装饰 emoji 对读屏隐藏 -->
  <main class="box">
    <div class="big" aria-hidden="true">🧭</div>
    <h1>页面不存在</h1>
    <p>你访问的地址没有对应内容，可能链接已变更。</p>
    <a class="btn" href="./">回到日理万机首页</a>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- P1-3：静态托管无承载层安全头时的 meta 兜底；404 页无需任何脚本，script-src 'none' 最严格且 file:// 兼容 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- P3-49：错误页不被索引，避免 /404.html 返回 200 收进结果 -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://xuange-hu.github.io/riwanji/" />
  <title>页面不存在 —— 日理万机</title>
  <!-- P3-18：内联样式外联，严格 CSP 下 404 页样式仍生效 -->
  <link rel="stylesheet" href="css/404.css" />
</head>
<body>
  <!-- 问题 65：内容包进 <main> 地标；问题 78：装饰 emoji 对读屏隐藏 -->
  <main class="box">
    <div class="big" aria-hidden="true">🧭</div>
    <h1>页面不存在</h1>
    <p>你访问的地址没有对应内容，可能链接已变更。</p>
    <a class="btn" href="./">回到日理万机首页</a>
  </main>
</body>
</html>
